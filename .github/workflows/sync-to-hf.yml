name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git lfs install
          git lfs track "model/*.pkl"
          git add .gitattributes
          git rm --cached model/outing_model.pkl
          git add model/outing_model.pkl
          git commit -m "Track model files with LFS" || true
          git remote add space https://TobenaiTsuru:$HF_TOKEN@huggingface.co/spaces/TobenaiTsuru/outing-planner
          git push space main --force
